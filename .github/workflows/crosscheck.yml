name: Cross-device check

# Sessions between a macOS runner and an x64 Windows runner, in both directions
# (scripts/crosscheck/crosscheck.sh). Hosted runners can't reach each other, so both join the
# tailnet through Tailscale workload identity federation with GitHub's OIDC token; no Tailscale
# secret is stored: the TS_CLIENT_ID and TS_AUDIENCE repository variables name a federated
# credential allowed to create keys for the tag in TS_TAGS (tag:ci by default). The Windows job
# prepares SSH and waits; the macOS job drives it like the Mac does a local VM, then tells it to
# finish.
on:
  schedule:
    # Every night, 03:07 in Korea.
    - cron: '7 18 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/crosscheck.yml
      - Cargo.lock
      - crates/**
      - scripts/crosscheck/**

permissions:
  contents: read

concurrency:
  group: crosscheck-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Both other jobs need the key, and they run at the same time, so neither can make it for the
  # other. It is good for this run only and only opens SSH on a runner that answers tailnet
  # addresses alone.
  ssh-key:
    name: SSH key for this run
    # Pull requests from forks get no OIDC token, so they couldn't join the tailnet.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.key.outputs.public }}
      private: ${{ steps.key.outputs.private }}
    steps:
      - id: key
        run: |
          ssh-keygen -q -t ed25519 -N '' -C "dari-check-$GITHUB_RUN_ID" -f key
          echo "public=$(cat key.pub)" >>"$GITHUB_OUTPUT"
          echo "private=$(base64 -w0 key)" >>"$GITHUB_OUTPUT"

  windows-peer:
    name: Windows peer
    needs: ssh-key
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Lets the Tailscale action exchange GitHub's OIDC token for a node key.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'schedule' }}
      - name: Build dari-check
        run: cargo build -p dari-check --locked
      - name: Let the macOS job drive this runner over SSH
        shell: powershell
        env:
          SSH_PUBLIC_KEY: ${{ needs.ssh-key.outputs.public }}
        run: |
          $ErrorActionPreference = 'Stop'
          # SSH and the check's UDP port only answer tailnet addresses.
          .\scripts\crosscheck\windows\prepare-peer.ps1 -PublicKey $env:SSH_PUBLIC_KEY -AllowFrom '100.64.0.0/10', 'fd7a:115c:a1e0::/48'
          Copy-Item target\debug\dari-check.exe C:\dari-check\dari-check.exe
          Copy-Item scripts\crosscheck\windows\interactive.ps1 C:\dari-check\interactive.ps1
      # Joining last means the runner shows up on the tailnet only once it is ready.
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          hostname: dari-check-${{ github.run_id }}
          # Peers are found with `tailscale ip`, not MagicDNS; keep the runner's own resolver.
          args: --accept-dns=false
      - name: Wait for the macOS job to finish
        shell: powershell
        run: |
          $deadline = (Get-Date).AddMinutes(50)
          while (-not (Test-Path C:\dari-check\done) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          if (-not (Test-Path C:\dari-check\done)) { throw 'the macOS job did not finish within 50 minutes' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: crosscheck-windows
          path: |
            C:\dari-check\logs
            C:\dari-check\frames
          if-no-files-found: ignore

  mac-driver:
    name: macOS driver
    needs: ssh-key
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'schedule' }}
      - name: Build dari-check and dari-relay
        run: cargo build -p dari-check -p dari-relay --locked
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          hostname: dari-check-${{ github.run_id }}-mac
          args: --accept-dns=false
      # On macOS the action points the Ethernet DNS at MagicDNS (100.100.100.100) regardless,
      # which resolves nothing here, and GitHub's artifact host stopped resolving. Peers are found
      # with `tailscale ip`, so give the runner its own DNS back.
      - name: Restore the runner's DNS
        run: |
          sudo networksetup -setdnsservers Ethernet Empty
          sudo networksetup -setsearchdomains Ethernet Empty
          dscacheutil -q host -a name github.com | head -n 2
      - name: Run the cross-device checks against the Windows peer
        env:
          SSH_PRIVATE_KEY: ${{ needs.ssh-key.outputs.private }}
          PEER: dari-check-${{ github.run_id }}
        run: scripts/crosscheck/ci-driver.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: crosscheck-mac
          path: target/crosscheck
          if-no-files-found: ignore
