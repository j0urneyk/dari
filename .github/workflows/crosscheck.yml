name: Cross-device check

# Sessions between two hosted runners, in both directions, for every pairing Dari supports:
# macOS and Windows, two macOS runners, and two x64 Windows runners
# (scripts/crosscheck/crosscheck.sh). Hosted runners can't reach each other, so all of them join
# the tailnet through Tailscale workload identity federation with GitHub's OIDC token; no
# Tailscale secret is stored: the TS_CLIENT_ID and TS_AUDIENCE repository variables name a
# federated credential allowed to create keys for the tag in TS_TAGS (tag:ci by default).
#
# For each pairing, peer jobs prepare SSH and wait, and a driver job drives them, then tells them
# to finish. When a pairing has a macOS side, the driver is that macOS runner itself (peer A);
# two Windows peers are driven from Linux, which also runs the relay. A macOS peer runs
# macos/interactive.sh serve in a step, since a program started over SSH there can't capture the
# screen. The repository is public, so runner minutes are free and every pairing runs on pull
# requests too.
on:
  schedule:
    # Every night, 03:07 in Korea.
    - cron: '7 18 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/crosscheck.yml
      - Cargo.lock
      - crates/**
      - scripts/crosscheck/**

permissions:
  contents: read

concurrency:
  group: crosscheck-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # The other jobs need the key, and they run at the same time, so none can make it for the
  # others. It is good for this run only and only opens SSH on a runner that answers tailnet
  # addresses alone.
  ssh-key:
    name: SSH key for this run
    # Pull requests from forks get no OIDC token, so they couldn't join the tailnet.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.key.outputs.public }}
      private: ${{ steps.key.outputs.private }}
    steps:
      - id: key
        run: |
          ssh-keygen -q -t ed25519 -N '' -C "dari-check-$GITHUB_RUN_ID" -f key
          echo "public=$(cat key.pub)" >>"$GITHUB_OUTPUT"
          echo "private=$(base64 -w0 key)" >>"$GITHUB_OUTPUT"

  peer:
    name: ${{ matrix.pairing }} peer ${{ matrix.side }} (${{ matrix.os }})
    needs: ssh-key
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pairing: mac-windows, side: b, os: windows }
          - { pairing: mac-mac, side: b, os: macos }
          - { pairing: windows-windows, side: a, os: windows }
          - { pairing: windows-windows, side: b, os: windows }
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Lets the Tailscale action exchange GitHub's OIDC token for a node key.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
          # One peer job per OS saves the cache; the others build the same thing.
          save-if: ${{ github.event_name == 'schedule' && matrix.pairing != 'windows-windows' }}
      - name: Build dari-check
        run: cargo build -p dari-check --locked
      - name: Let the driver reach this Windows runner over SSH
        if: matrix.os == 'windows'
        shell: powershell
        env:
          SSH_PUBLIC_KEY: ${{ needs.ssh-key.outputs.public }}
        run: |
          $ErrorActionPreference = 'Stop'
          # SSH and the check's UDP port only answer tailnet addresses.
          .\scripts\crosscheck\windows\prepare-peer.ps1 -PublicKey $env:SSH_PUBLIC_KEY -AllowFrom '100.64.0.0/10', 'fd7a:115c:a1e0::/48'
          Copy-Item target\debug\dari-check.exe C:\dari-check\dari-check.exe
          Copy-Item scripts\crosscheck\windows\interactive.ps1 C:\dari-check\interactive.ps1
      - name: Let the driver reach this Mac over SSH
        if: matrix.os == 'macos'
        env:
          SSH_PUBLIC_KEY: ${{ needs.ssh-key.outputs.public }}
        run: |
          scripts/crosscheck/macos/prepare-peer.sh "$SSH_PUBLIC_KEY"
          cp target/debug/dari-check ~/dari-check/dari-check
      # Joining last means the runner shows up on the tailnet only once it is ready.
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          hostname: dari-check-${{ github.run_id }}-${{ matrix.pairing }}-${{ matrix.side }}
          # Peers are found with `tailscale ip`, not MagicDNS; keep the runner's own resolver.
          args: --accept-dns=false
      # On macOS the action points the Ethernet DNS at MagicDNS (100.100.100.100) regardless,
      # which resolves nothing here, and GitHub's artifact host stopped resolving. Peers are found
      # with `tailscale ip`, so give the runner its own DNS back.
      - name: Restore the runner's DNS
        if: matrix.os == 'macos'
        run: |
          sudo networksetup -setdnsservers Ethernet Empty
          sudo networksetup -setsearchdomains Ethernet Empty
          dscacheutil -q host -a name github.com | head -n 2
      - name: Wait for the driver to finish
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $deadline = (Get-Date).AddMinutes(50)
          while (-not (Test-Path C:\dari-check\done) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          if (-not (Test-Path C:\dari-check\done)) { throw 'the driver did not finish within 50 minutes' }
      # Runs what the driver asks for from this step, whose processes may capture the screen and
      # inject input, until the driver finishes.
      - name: Run programs for the driver until it finishes
        if: matrix.os == 'macos'
        run: scripts/crosscheck/macos/interactive.sh serve --until ~/dari-check/done --timeout 3000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.os == 'windows'
        with:
          name: crosscheck-${{ matrix.pairing }}-${{ matrix.side }}
          path: |
            C:\dari-check\logs
            C:\dari-check\frames
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.os == 'macos'
        with:
          name: crosscheck-${{ matrix.pairing }}-${{ matrix.side }}
          path: |
            ~/dari-check/logs
            ~/dari-check/frames
          if-no-files-found: ignore

  driver:
    name: ${{ matrix.pairing }} driver (${{ matrix.os }})
    needs: ssh-key
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pairing: mac-windows, os: macos, a: local, b: windows }
          - { pairing: mac-mac, os: macos, a: local, b: macos }
          - { pairing: windows-windows, os: ubuntu, a: windows, b: windows }
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.event_name == 'schedule' && matrix.pairing != 'mac-mac' }}
      # Only a driver that is also a peer needs dari-check.
      - name: Build
        run: cargo build -p dari-relay ${{ matrix.a == 'local' && '-p dari-check' || '' }} --locked
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          hostname: dari-check-${{ github.run_id }}-${{ matrix.pairing }}-driver
          args: --accept-dns=false
      - name: Restore the runner's DNS
        if: matrix.os == 'macos'
        run: |
          sudo networksetup -setdnsservers Ethernet Empty
          sudo networksetup -setsearchdomains Ethernet Empty
          dscacheutil -q host -a name github.com | head -n 2
      - name: Run the cross-device checks
        env:
          SSH_PRIVATE_KEY: ${{ needs.ssh-key.outputs.private }}
          PEER_A: ${{ matrix.a == 'local' && 'local' || format('{0}:dari-check-{1}-{2}-a', matrix.a, github.run_id, matrix.pairing) }}
          PEER_B: ${{ format('{0}:dari-check-{1}-{2}-b', matrix.b, github.run_id, matrix.pairing) }}
        run: scripts/crosscheck/ci-driver.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: crosscheck-${{ matrix.pairing }}-driver
          path: target/crosscheck
          if-no-files-found: ignore
