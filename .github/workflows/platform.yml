name: Platform checks

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag whose Windows installer to smoke-test
        required: false
        default: v0.0.3
  pull_request:
    paths:
      - .github/workflows/platform.yml
      - crates/session/tests/real_platform.rs
      - crates/winsvc/**
      - crates/app/assets/installer.nsi
      - crates/app/Cargo.toml

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RELEASE_TAG: ${{ inputs.release || 'v0.0.3' }}
  CARGO_PACKAGER_VERSION: 0.11.8
  PER_USER_RELEASE: v0.0.3

jobs:
  real-platform:
    name: Real screen and input (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Session on the real screen and pointer
        run: cargo test -p dari-session --test real_platform --locked -- --ignored --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: real-platform-frame-${{ matrix.os }}
          path: target/real-platform/frame.png
          if-no-files-found: ignore

  windows-installer:
    name: Windows installer smoke test
    runs-on: windows-latest
    steps:
      - name: Download the released installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "*-setup.exe" --dir installer
      - name: Install silently and host a session from the installed app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem installer -Filter *-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles -Filter dari.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'dari.exe was not installed' }
          Write-Host "installed: $($exe.FullName)"
          & $exe.FullName --version

          $hostProcess = Start-Process -FilePath $exe.FullName -ArgumentList 'host', '--port', '47821' -RedirectStandardOutput host.log -RedirectStandardError host.err -PassThru -NoNewWindow
          $password = $null
          for ($i = 0; $i -lt 60 -and -not $password; $i++) {
            Start-Sleep -Milliseconds 500
            $match = Select-String -Path host.log -Pattern 'Access password: (\S+)' -ErrorAction SilentlyContinue | Select-Object -Last 1
            if ($match) { $password = $match.Matches[0].Groups[1].Value }
          }
          if (-not $password) { Get-Content host.log, host.err; throw 'the installed host never printed a password' }
          Set-Content -Path password.txt -Value $password -NoNewline

          $viewer = Start-Process -FilePath $exe.FullName -ArgumentList 'connect', '127.0.0.1:47821' -RedirectStandardInput password.txt -RedirectStandardOutput connect.log -RedirectStandardError connect.err -PassThru -NoNewWindow
          Start-Sleep -Seconds 15
          Stop-Process -Id $viewer.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $hostProcess.Id -Force -ErrorAction SilentlyContinue

          Write-Host '--- host'; Get-Content host.log
          Write-Host '--- viewer'; Get-Content connect.log
          $viewerLog = Get-Content connect.log -Raw
          if ($viewerLog -notmatch 'Connected to') { Get-Content connect.err; throw 'the viewer did not connect' }
          if ($viewerLog -notmatch 'host screen: Available, host input: Available') { throw 'the host did not report a working screen and input' }
          if ($viewerLog -notmatch 'frame Some\(\(\d+, \d+\)\)') { throw 'no frames were decoded' }

  windows-installer-branch:
    name: Windows installer from this branch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version "$env:CARGO_PACKAGER_VERSION"
      - name: Package installer
        working-directory: crates/app
        run: cargo packager --release --formats nsis
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-branch
          path: target/release/*-setup.exe
          if-no-files-found: error
      - name: Download the last per-user release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:PER_USER_RELEASE" --repo "$env:GITHUB_REPOSITORY" --pattern "*-setup.exe" --dir per-user-installer
      - name: Refuse a standard user
        # Windows PowerShell, whose LocalAccounts cmdlets run in process.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:ProgramFiles 'Dari'
          $shared = 'C:\dari-standard-user'
          New-Item -ItemType Directory -Path $shared | Out-Null
          $perUserSetup = Join-Path $shared 'per-user-setup.exe'
          $setup = Join-Path $shared 'dari-setup.exe'
          Copy-Item (Get-ChildItem per-user-installer -Filter *-setup.exe | Select-Object -First 1).FullName $perUserSetup
          Copy-Item (Get-ChildItem target/release -Filter *-setup.exe | Select-Object -First 1).FullName $setup

          $bytes = New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $password = ConvertTo-SecureString ([Convert]::ToBase64String($bytes) + 'a1!') -AsPlainText -Force
          $user = New-LocalUser -Name dari-standard -Password $password -AccountNeverExpires -PasswordNeverExpires
          try {
            try { Add-LocalGroupMember -SID S-1-5-32-545 -Member $user } catch [Microsoft.PowerShell.Commands.MemberExistsException] {}
            $credential = New-Object Management.Automation.PSCredential ('dari-standard', $password)

            function Invoke-AsStandardUser([string]$path) {
              $process = Start-Process -FilePath $path -ArgumentList '/S' -Credential $credential -LoadUserProfile -WorkingDirectory $shared -Wait -PassThru
              if ($null -eq $process.ExitCode) { throw "no exit code for $path run as dari-standard" }
              $process.ExitCode
            }

            $code = Invoke-AsStandardUser $perUserSetup
            if ($code -ne 0) { throw "$env:PER_USER_RELEASE's installer exited with code $code for dari-standard" }
            $profileDir = (Get-CimInstance Win32_UserProfile | Where-Object SID -eq $user.SID.Value).LocalPath
            $perUserFiles = 'dari.exe', 'uninstall.exe' | ForEach-Object { Join-Path $profileDir "AppData\Local\Dari\$_" }
            foreach ($file in $perUserFiles) { if (-not (Test-Path -LiteralPath $file)) { throw "$env:PER_USER_RELEASE did not install $file for dari-standard" } }

            $code = Invoke-AsStandardUser $setup
            if ($code -eq 0) { throw 'the branch installer succeeded for a standard user' }
            if (Get-Service DariService -ErrorAction SilentlyContinue) { throw 'DariService exists after a standard user ran the installer' }
            if (Test-Path -LiteralPath $installDir) { throw "$installDir exists after a standard user ran the installer" }
            foreach ($file in $perUserFiles) { if (-not (Test-Path -LiteralPath $file)) { throw "the refused installer removed $file" } }
            Write-Host "the branch installer refused dari-standard with exit code $code and changed nothing"
          } finally {
            Get-CimInstance Win32_UserProfile | Where-Object SID -eq $user.SID.Value | Remove-CimInstance -ErrorAction Continue
            Remove-LocalUser -SID $user.SID
            Remove-Item -LiteralPath $shared -Recurse -Force
          }
      - name: Upgrade a per-user install, repair, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perUserDir = Join-Path $env:LOCALAPPDATA 'Dari'
          $perUserKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Dari'
          $dataDir = Join-Path $env:LOCALAPPDATA 'dari\dari\data'
          $installDir = Join-Path $env:ProgramFiles 'Dari'
          $setup = (Get-ChildItem target/release -Filter *-setup.exe | Select-Object -First 1).FullName
          $perUserLinks = (Join-Path ([Environment]::GetFolderPath('Programs')) 'Dari\Dari.lnk'), (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Dari.lnk')
          $perUserProductKey = 'HKCU:\Software\dari\Dari'
          $policyKey = 'HKLM:\SOFTWARE\Policies\Dari'

          function Invoke-Setup([string]$path, [string]$what, [string]$arguments = '/S') {
            $process = Start-Process -FilePath $path -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$what exited with code $($process.ExitCode)" }
          }

          function Assert-Policy([int]$expected, [string]$after) {
            $key = Get-Item -LiteralPath $policyKey -ErrorAction SilentlyContinue
            $value = if ($key) { $key.GetValue('SecureDesktopControl') }
            if ($null -eq $value) { throw "SecureDesktopControl is missing after $after" }
            $kind = $key.GetValueKind('SecureDesktopControl')
            if ($kind -ne 'DWord' -or $value -ne $expected) { throw "SecureDesktopControl is $kind $value after $after, not DWord $expected" }
            Write-Host "after ${after}: SecureDesktopControl is $value"
          }

          function Get-DataHashes {
            Get-ChildItem -LiteralPath $dataDir -Recurse -File | Sort-Object FullName |
              ForEach-Object { "$($_.FullName) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }
          }

          function Assert-DataUnchanged([string]$after) {
            $now = Get-DataHashes
            if (($now -join "`n") -ne ($dataHashes -join "`n")) {
              Write-Host 'before:'; $dataHashes; Write-Host 'now:'; $now
              throw "the app's data changed after $after"
            }
          }

          # Rights that let a holder change or replace what is in the folder, plus the generic write
          # and all bits an inherit-only ACE can carry. Modify and FullControl include them.
          $writeRights = [int][Security.AccessControl.FileSystemRights]'WriteData, AppendData, WriteAttributes, WriteExtendedAttributes, Delete, DeleteSubdirectoriesAndFiles, ChangePermissions, TakeOwnership' -bor 0x40000000 -bor 0x10000000
          $unprivileged = @{ 'S-1-5-32-545' = 'BUILTIN\Users'; 'S-1-1-0' = 'Everyone'; 'S-1-5-11' = 'Authenticated Users'; 'S-1-5-4' = 'INTERACTIVE' }

          function Assert-NoUnprivilegedWrite([string]$path) {
            $rules = (Get-Acl -LiteralPath $path).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])
            foreach ($rule in $rules) {
              $sid = $rule.IdentityReference.Value
              if ($rule.AccessControlType -eq 'Allow' -and $unprivileged.ContainsKey($sid) -and ([int]$rule.FileSystemRights -band $writeRights)) {
                throw "$path grants $($unprivileged[$sid]) $($rule.FileSystemRights)"
              }
            }
          }

          $probe = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'acl-probe')
          icacls $probe.FullName /grant '*S-1-5-32-545:(OI)(CI)M' | Out-Null
          $missed = $true
          try { Assert-NoUnprivilegedWrite $probe.FullName } catch { $missed = $false; Write-Host "the ACL check works: $_" }
          if ($missed) { throw 'the ACL check missed a Modify grant to BUILTIN\Users' }

          function Assert-Installed([string]$after) {
            $service = Get-CimInstance Win32_Service -Filter "Name='DariService'"
            if (-not $service) { throw "DariService is missing after $after" }
            $expectedPath = '"' + (Join-Path $installDir 'dari-service.exe') + '" service'
            if ($service.State -ne 'Running') { throw "DariService is $($service.State) after $after" }
            if ($service.StartName -ne 'LocalSystem') { throw "DariService runs as $($service.StartName)" }
            if ($service.StartMode -ne 'Auto') { throw "DariService's start mode is $($service.StartMode)" }
            if ($service.PathName -ne $expectedPath) { throw "DariService's image path is $($service.PathName), not $expectedPath" }
            $failureActions = sc.exe qfailure DariService | Out-String
            if ($failureActions -notmatch 'RESTART -- Delay = 5000') { $failureActions; throw 'DariService does not restart on failure' }
            $entry = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'DariService' } -MaxEvents 1 -ErrorAction SilentlyContinue
            if (-not $entry) { throw "the Application log has no DariService entry after $after" }
            if (-not $entry.Message -or $entry.Message -match 'cannot be found') { throw "DariService's event $($entry.Id) does not render after ${after}: $($entry.Message)" }
            foreach ($file in 'dari.exe', 'dari-service.exe') {
              if (-not (Test-Path -LiteralPath (Join-Path $installDir $file))) { throw "$file is not in $installDir after $after" }
            }
            if (Test-Path -LiteralPath (Join-Path $perUserDir 'dari.exe')) { throw "a per-user dari.exe remains after $after" }
            if (Test-Path -LiteralPath (Join-Path $perUserDir 'uninstall.exe')) { throw "the per-user uninstaller remains after $after" }
            if (Test-Path $perUserKey) { throw "the per-user uninstall key remains after $after" }
            if (Test-Path $perUserProductKey) { throw "$perUserProductKey remains after $after" }
            foreach ($link in $perUserLinks) { if (Test-Path -LiteralPath $link) { throw "the per-user shortcut $link remains after $after" } }
            Assert-NoUnprivilegedWrite $installDir
            Assert-NoUnprivilegedWrite (Join-Path $installDir 'dari-service.exe')
            Assert-DataUnchanged $after
            Write-Host "after ${after}: DariService runs as LocalSystem from $installDir"
          }

          Invoke-Setup (Get-ChildItem per-user-installer -Filter *-setup.exe | Select-Object -First 1).FullName "$env:PER_USER_RELEASE's installer"
          $perUserExe = Join-Path $perUserDir 'dari.exe'
          if (-not (Test-Path -LiteralPath $perUserExe)) { throw "$env:PER_USER_RELEASE did not install $perUserExe" }
          if (-not (Test-Path $perUserKey)) { throw "$env:PER_USER_RELEASE wrote no per-user uninstall key" }
          if (-not (Test-Path $perUserProductKey)) { throw "$env:PER_USER_RELEASE wrote no $perUserProductKey" }
          foreach ($link in $perUserLinks) {
            if (-not (Test-Path -LiteralPath $link)) {
              Get-ChildItem $env:APPDATA, $env:USERPROFILE, $env:PUBLIC -Recurse -Filter Dari.lnk -ErrorAction SilentlyContinue | ForEach-Object FullName
              throw "$env:PER_USER_RELEASE did not create $link"
            }
          }
          Write-Host "$env:PER_USER_RELEASE created $($perUserLinks -join ' and ')"
          $hostProcess = Start-Process -FilePath $perUserExe -ArgumentList 'host', '--port', '47821' -RedirectStandardOutput per-user-host.log -RedirectStandardError per-user-host.err -PassThru -NoNewWindow
          for ($i = 0; $i -lt 60 -and -not (Test-Path -LiteralPath (Join-Path $dataDir 'identity-key.der')); $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 2
          Stop-Process -Id $hostProcess.Id -Force
          Wait-Process -Id $hostProcess.Id -ErrorAction SilentlyContinue
          Set-Content -LiteralPath (Join-Path $dataDir 'settings.toml') -Value "port = 47830`nrecent_addresses = [`"192.0.2.1`"]"
          $dataHashes = Get-DataHashes
          foreach ($file in 'identity-cert.der', 'identity-key.der', 'settings.toml') {
            if (-not ($dataHashes -match [regex]::Escape("\$file "))) { Get-Content per-user-host.log, per-user-host.err; throw "the per-user app did not leave $file in $dataDir" }
          }
          $dataHashes

          $canary = Join-Path $env:RUNNER_TEMP 'canary'
          New-Item -ItemType Directory -Path $canary | Out-Null
          $canaryMarker = Join-Path $canary 'ran.txt'
          $canaryScript = Join-Path $canary 'uninstall.cmd'
          Set-Content -LiteralPath $canaryScript -Value "@echo ran> `"$canaryMarker`""
          $start = [Diagnostics.ProcessStartInfo]::new($canaryScript, "/S _?=$perUserDir")
          $start.UseShellExecute = $false
          [Diagnostics.Process]::Start($start).WaitForExit()
          if (-not (Test-Path -LiteralPath $canaryMarker)) { throw 'the canary left no marker when started directly' }
          Remove-Item -LiteralPath $canaryMarker
          Set-ItemProperty -Path $perUserKey -Name UninstallString -Value "`"$canaryScript`""

          Invoke-Setup $setup 'the branch installer over the per-user install'
          if (Test-Path -LiteralPath $canaryMarker) { throw 'the installer ran the program named by the per-user UninstallString' }
          Assert-Installed 'the upgrade from a per-user install'
          Assert-Policy 1 'the upgrade from a per-user install'

          New-ItemProperty -LiteralPath $policyKey -Name SecureDesktopControl -PropertyType DWord -Value 0 -Force | Out-Null
          Invoke-Setup $setup 'the branch installer run again'
          Assert-Installed 'a repair'
          Assert-Policy 0 'a repair'

          # The reinstall page runs the installed uninstaller this way before an upgrade.
          Invoke-Setup (Join-Path $installDir 'uninstall.exe') 'the uninstaller run with /P' "/S /P _?=$installDir"
          Assert-Policy 0 'the uninstaller run with /P'
          Invoke-Setup $setup 'the branch installer after the uninstaller run with /P'
          Assert-Installed 'an upgrade'
          Assert-Policy 0 'an upgrade'

          Invoke-Setup (Join-Path $installDir 'uninstall.exe') 'the uninstaller'
          for ($i = 0; $i -lt 30 -and (Get-Service DariService -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          if (Get-Service DariService -ErrorAction SilentlyContinue) { throw 'DariService remains after uninstalling' }
          foreach ($file in 'dari.exe', 'dari-service.exe') {
            if (Test-Path -LiteralPath (Join-Path $installDir $file)) { throw "$file remains in $installDir after uninstalling" }
          }
          if (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Dari') { throw 'the uninstall key remains after uninstalling' }
          # The uninstaller finishes in a temporary copy of itself, which can outlive the process started here.
          for ($i = 0; $i -lt 30 -and (Test-Path -LiteralPath $policyKey); $i++) { Start-Sleep -Milliseconds 500 }
          if (Get-ItemProperty -LiteralPath $policyKey -Name SecureDesktopControl -ErrorAction SilentlyContinue) { throw 'SecureDesktopControl remains after uninstalling' }
          if (Test-Path -LiteralPath $policyKey) { throw "$policyKey remains after uninstalling" }
          Assert-DataUnchanged 'uninstalling'
          Write-Host 'uninstalling removed DariService, the files, and the policy, and kept the data'
