[package]
name = "dari"
description = "Cross-platform remote desktop for macOS and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
dari-input.workspace = true
dari-media.workspace = true
dari-net.workspace = true
dari-proto.workspace = true
dari-session.workspace = true

anyhow.workspace = true
clap.workspace = true
directories.workspace = true
gethostname.workspace = true
gpui-kit.workspace = true
if-addrs.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp"] }
rpassword.workspace = true
serde.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true

[dev-dependencies]
dari-relay.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[[test]]
name = "gui"
# Needs GPUI's Metal renderer on the main thread; select explicitly with --test gui.
test = false
harness = false

[lints]
workspace = true

[package.metadata.packager]
product-name = "Dari"
identifier = "dev.dari.app"
description = "Remote desktop for macOS and Windows"
authors = ["Dari contributors"]
category = "Utility"
icons = [
    "assets/icons/icon.icns",
    "assets/icons/icon-32.png",
    "assets/icons/icon-128.png",
    "assets/icons/icon-256.png",
    "assets/icons/icon-512.png",
    "assets/icons/icon-1024.png",
]
before-packaging-command = "cargo build --release --locked -p dari"
out-dir = "../../target/release"
binaries = [{ path = "dari", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
info-plist-path = "assets/Info.plist"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
