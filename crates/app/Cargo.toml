[package]
name = "open-desk"
description = "Cross-platform remote desktop for macOS and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
open-desk-input.workspace = true
open-desk-media.workspace = true
open-desk-net.workspace = true
open-desk-proto.workspace = true
open-desk-session.workspace = true

anyhow.workspace = true
clap.workspace = true
directories.workspace = true
gethostname.workspace = true
gpui-kit.workspace = true
if-addrs.workspace = true
image = { workspace = true, features = ["png"] }
rpassword.workspace = true
serde.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
open-desk-relay.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[[test]]
name = "gui"
# Needs GPUI's Metal renderer on the main thread; select explicitly with --test gui.
test = false
harness = false

[lints]
workspace = true
