[package]
name = "dari"
description = "Cross-platform remote desktop for macOS and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
dari-input.workspace = true
dari-media.workspace = true
dari-net.workspace = true
dari-proto.workspace = true
dari-session.workspace = true

anyhow.workspace = true
clap.workspace = true
directories.workspace = true
gethostname.workspace = true
gpui-kit.workspace = true
if-addrs.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp"] }
rpassword.workspace = true
serde.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true

[dev-dependencies]
dari-relay.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
sha2.workspace = true
tempfile = "3"

[[test]]
name = "gui"
# Needs GPUI's Metal renderer on the main thread; select explicitly with --test gui.
test = false
harness = false

[lints]
workspace = true

[package.metadata.packager]
product-name = "Dari"
identifier = "dev.dari.app"
description = "Remote desktop for macOS and Windows"
authors = ["Dari contributors"]
category = "Utility"
icons = [
    "assets/icons/icon.icns",
    "assets/icons/icon-32.png",
    "assets/icons/icon-128.png",
    "assets/icons/icon-256.png",
    "assets/icons/icon-512.png",
    "assets/icons/icon-1024.png",
]
before-packaging-command = "cargo build --release --locked -p dari -p dari-winsvc"
out-dir = "../../target/release"
# cargo-packager has no per-platform binaries, so the macOS app carries the dari-service stub too.
binaries = [{ path = "dari", main = true }, { path = "dari-service" }]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
info-plist-path = "assets/Info.plist"

[package.metadata.packager.nsis]
installer-mode = "perMachine"
template = "assets/installer.nsi"
preinstall-section = '''
!macro DariRefuse MESSAGE
  MessageBox MB_ICONSTOP|MB_OK "${MESSAGE}" /SD IDOK
  Abort "${MESSAGE}"
!macroend

!macro DariWaitForServiceExit
  ; The service reports Stopped just before its process exits, and dari-service.exe stays locked until then.
  StrCpy $1 0
  ${Do}
    nsis_tauri_utils::FindProcess "dari-service.exe"
    Pop $0
    ${IfThen} $0 <> 0 ${|} ${ExitDo} ${|}
    Sleep 250
    IntOp $1 $1 + 1
  ${LoopUntil} $1 >= 40
!macroend

Section RequireAdministrator
  ; RequestExecutionLevel highest runs the installer unelevated for a standard user, without a UAC prompt.
  UserInfo::GetAccountType
  Pop $0
  ${If} $0 != "Admin"
    !insertmacro DariRefuse "Installing Dari needs administrator rights. Right-click the installer and choose Run as administrator."
  ${EndIf}
SectionEnd

Section StopDariService
  nsExec::Exec '"$SYSDIR\net.exe" stop DariService'
  Pop $0
  !insertmacro DariWaitForServiceExit
SectionEnd

Section RemovePerUserInstall
  ClearErrors
  EnumRegValue $0 HKCU "${UNINSTKEY}" 0
  ${IfNot} ${Errors}
    SetShellVarContext current
    nsis_tauri_utils::FindProcess "${MAINBINARYNAME}.exe"
    Pop $0
    ${If} $0 = 0
      ${IfNot} ${Silent}
      ${AndIf} $PassiveMode != 1
        MessageBox MB_OKCANCEL "$(appRunningOkKill)" IDOK +2
        Abort "$(appRunning)"
      ${EndIf}
      nsis_tauri_utils::KillProcess "${MAINBINARYNAME}.exe"
      Pop $0
      Sleep 500
    ${EndIf}
    Delete "$LOCALAPPDATA\${PRODUCTNAME}\${MAINBINARYNAME}.exe"
    ${If} ${FileExists} "$LOCALAPPDATA\${PRODUCTNAME}\${MAINBINARYNAME}.exe"
      !insertmacro DariRefuse "Dari could not remove its earlier copy in $LOCALAPPDATA\${PRODUCTNAME}. Close Dari and run the installer again."
    ${EndIf}
    Delete "$LOCALAPPDATA\${PRODUCTNAME}\uninstall.exe"
    Delete "$SMPROGRAMS\${PRODUCTNAME}\${PRODUCTNAME}.lnk"
    RMDir "$SMPROGRAMS\${PRODUCTNAME}"
    Delete "$DESKTOP\${PRODUCTNAME}.lnk"
    ; Never recursive: this folder is also %LOCALAPPDATA%\dari, which holds the app's identity and settings.
    RMDir "$LOCALAPPDATA\${PRODUCTNAME}"
    DeleteRegKey HKCU "${MANUPRODUCTKEY}"
    DeleteRegKey /ifempty HKCU "Software\${MANUFACTURER}"
    DeleteRegKey HKCU "${UNINSTKEY}"
    SetShellVarContext all
  ${EndIf}
SectionEnd
'''
