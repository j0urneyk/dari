[package]
name = "open-desk"
description = "Cross-platform remote desktop for macOS and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
open-desk-input.workspace = true
open-desk-media.workspace = true
open-desk-net.workspace = true
open-desk-proto.workspace = true
open-desk-session.workspace = true

anyhow.workspace = true
clap.workspace = true
directories.workspace = true
gethostname.workspace = true
gpui-kit.workspace = true
if-addrs.workspace = true
image = { workspace = true, features = ["png"] }
rpassword.workspace = true
serde.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
open-desk-relay.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[[test]]
name = "gui"
# Needs GPUI's Metal renderer on the main thread; select explicitly with --test gui.
test = false
harness = false

[lints]
workspace = true

[package.metadata.packager]
product-name = "open-desk"
identifier = "dev.open-desk.app"
description = "Remote desktop for macOS and Windows"
authors = ["open-desk contributors"]
category = "Utility"
icons = [
    "assets/icons/icon.icns",
    "assets/icons/icon-32.png",
    "assets/icons/icon-128.png",
    "assets/icons/icon-256.png",
    "assets/icons/icon-512.png",
    "assets/icons/icon-1024.png",
]
before-packaging-command = "cargo build --release --locked -p open-desk"
out-dir = "../../target/release"
binaries = [{ path = "open-desk", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "12.0"
info-plist-path = "assets/Info.plist"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
